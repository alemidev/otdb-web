[package]
name = "opentrivia-web"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["json", "ws"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
thiserror = "2.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "signal", "sync", "net"] }
tracing = "0.1"
tracing-subscriber = "0.3"
